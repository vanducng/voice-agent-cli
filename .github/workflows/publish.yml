name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node (v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin supported npm CLI
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Validate package and tag
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "${PACKAGE_NAME}" != "voice-agent-cli" ]; then
            echo "Unexpected package name: ${PACKAGE_NAME}" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_NAME}" != "v${PACKAGE_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}" >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Build
        run: npm run build

      - name: Test packed CLI
        run: npm run test:package

      - name: Pack and dry-run release artifact
        run: |
          npm pack --ignore-scripts
          npm publish --dry-run --ignore-scripts ./voice-agent-cli-*.tgz

      - name: Upload release artifact (v7.0.1)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-package
          path: "voice-agent-cli-*.tgz"
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node (v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin supported npm CLI
        run: npm install --global npm@11.18.0

      - name: Download release artifact (v8.0.1)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: npm-package

      - name: Publish with OIDC
        run: npm publish --access public --ignore-scripts ./voice-agent-cli-*.tgz

      - name: Verify registry version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for _ in 1 2 3 4 5; do
            if [ "$(npm view "voice-agent-cli@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
              exit 0
            fi
            sleep 3
          done
          exit 1
