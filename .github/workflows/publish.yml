name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Open or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validate:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node (v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin supported npm CLI
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Validate package and tag
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "${PACKAGE_NAME}" != "voice-agent-cli" ]; then
            echo "Unexpected package name: ${PACKAGE_NAME}" >&2
            exit 1
          fi

          if [ "${TAG_NAME}" != "v${PACKAGE_VERSION}" ]; then
            echo "Tag ${TAG_NAME} does not match package version ${PACKAGE_VERSION}" >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Build
        run: npm run build

      - name: Test packed CLI
        run: npm run test:package

      - name: Pack and dry-run release artifact
        run: |
          npm pack --ignore-scripts
          npm publish --dry-run --ignore-scripts ./voice-agent-cli-*.tgz

      - name: Upload release artifact (v7.0.1)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-package
          path: "voice-agent-cli-*.tgz"
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs:
      - release-please
      - validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node (v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin supported npm CLI
        run: npm install --global npm@11.18.0

      - name: Download release artifact (v8.0.1)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: npm-package

      - name: Publish with OIDC
        run: npm publish --access public --ignore-scripts ./voice-agent-cli-*.tgz

      - name: Verify registry version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          for _ in 1 2 3 4 5; do
            if [ "$(npm view "voice-agent-cli@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
              exit 0
            fi
            sleep 3
          done
          exit 1
